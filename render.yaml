services:
  - type: web
    name: sigep
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_MODE
        value: local
      - key: VITE_AUTH_MODE
        value: entra
      - key: VITE_ENTRA_CLIENT_ID
        sync: false
      - key: VITE_ENTRA_TENANT_ID
        sync: false
      - key: VITE_ENTRA_API_SCOPE
        value: ""
